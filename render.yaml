services:
  - type: web
    name: nightwatch-api
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.server:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:          # redeploy (and cut off live runs) only when the service itself changes
      paths:
        - nightwatch/**
        - app/server.py
        - scripts/redteam.py
        - data/cases.jsonl
        - data/attack.json
        - data/labels.json
        - requirements.txt
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RUNS_PER_VISITOR
        value: "6"
      - key: RUNS_PER_DAY
        value: "30"
      - key: DAILY_DOLLARS
        value: "1.0"
      - key: RUNS_AT_ONCE
        value: "2"

  - type: web
    name: nightwatch-app
    runtime: static
    branch: main
    buildCommand: echo "page is prebuilt by scripts/build_site.py"
    staticPublishPath: ./app/site
    autoDeploy: true
    buildFilter:
      paths:
        - app/site/**
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
