name: ci
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Offline tests (scripted model, no key, no cost)
        run: python -m pytest -q
      - name: Offline run of both systems
        run: |
          python scripts/run.py --system nightwatch --split dev --limit 5 --model fake --run-id ci-nightwatch
          python scripts/run.py --system single_call --split dev --limit 5 --model fake --run-id ci-single
